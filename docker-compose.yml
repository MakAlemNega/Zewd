# Self-hosted stack: the app + a local MongoDB. Resend, Vercel Blob, and
# Sentry are external hosted services either way — there's nothing to run
# for them here, just env vars (see .env.example).
#
# Usage:
#   docker compose up --build -d
#
# The app reads MONGODB_URI, SESSION_SECRET, etc. from the environment at
# container start (not baked into the image) — set them in a real .env file
# next to this compose file, or export them in your shell before running.

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/ZewdDB
      SESSION_SECRET: ${SESSION_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
